<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080c1d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Écho : un puzzle game en pixel art où l'on coopère avec les échos de ses tentatives précédentes." />
    <title>Écho</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="frame">
      <canvas id="screen" aria-label="Écho, écran de jeu"></canvas>

      <!-- Commandes, en transparence par-dessus le jeu. -->
      <div id="controls">
        <div id="stick-zone" aria-hidden="true">
          <div id="stick-ghost"></div>
          <div id="stick-base"><div id="stick-knob"></div></div>
        </div>
        <div id="pad-buttons" aria-hidden="true">
          <button id="btn-grab" class="pad-btn ab-grab" type="button" tabindex="-1">Agripper</button>
          <button id="btn-dash" class="pad-btn ab-dash" type="button" tabindex="-1">Dash</button>
          <button id="btn-jump" class="pad-btn big" type="button" tabindex="-1">Saut</button>
        </div>
        <div id="actions">
          <button id="btn-replay" type="button" tabindex="-1">Rejouer<kbd>R</kbd></button>
          <button id="btn-restart" type="button" tabindex="-1">Effacer<kbd>⌫</kbd></button>
          <button id="btn-menu" type="button" tabindex="-1" aria-label="Menu">Menu<kbd>Échap</kbd></button>
        </div>
        <p id="keys-hint"></p>
      </div>

      <div id="overlay" hidden></div>
      <div id="toast" aria-live="polite"></div>

      <div id="rotate">
        <div class="phone" aria-hidden="true"></div>
        <p>Tourne ton téléphone :<br />Écho se joue en largeur.</p>
        <button id="btn-rotate-dismiss" type="button">Jouer quand même</button>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
